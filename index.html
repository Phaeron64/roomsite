<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat Rooms</title>

<style>
body {
    margin: 0;
    background: #ffffff;
    color: #000000;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}

a {
    color: #0000cc;
}

.page {
    width: 640px;
    max-width: calc(100% - 20px);
    margin: 25px auto;
}

.header {
    background: #000080;
    color: white;
    font-weight: bold;
    font-size: 20px;
    padding: 6px 8px;
}

.subheader {
    background: #c0c0c0;
    border: 1px solid #808080;
    padding: 4px 8px;
    font-size: 11px;
}

.content {
    margin-top: 16px;
    border: 1px solid #808080;
    padding: 16px;
}

h1 {
    font-size: 18px;
    margin-top: 0;
}

hr {
    border: 0;
    border-top: 1px solid #808080;
}

table {
    width: 100%;
}

td {
    padding: 5px;
}

input {
    width: 100%;
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 3px;
    border: 2px inset #dddddd;
}

button {
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 3px 18px;
}

#error {
    display: none;
    color: #cc0000;
    font-weight: bold;
    margin-top: 10px;
}

.footer {
    margin-top: 18px;
    font-size: 10px;
    color: #666666;
    text-align: center;
}
</style>
</head>

<body>

<div class="page">

    <div class="header">
        Chat Rooms
    </div>

    <div class="subheader">
        Simple temporary chat rooms
    </div>

    <div class="content">

        <h1>Join a Chat Room</h1>

        <p>
            Enter your nickname and a room number between
            0 and 1000000.
        </p>

        <hr>

        <table>
            <tr>
                <td width="120">Nickname:</td>
                <td>
                    <input id="nickname" maxlength="24">
                </td>
            </tr>

            <tr>
                <td>Room number:</td>
                <td>
                    <input
                        id="room"
                        type="number"
                        min="0"
                        max="1000000"
                    >
                </td>
            </tr>
        </table>

        <br>

        <button id="joinButton">
            Join Room
        </button>

        <div id="error">
            Please enter a valid nickname and room number.
        </div>

    </div>

    <div class="footer">
        Messages are temporary.
    </div>

</div>


<script>
const nicknameInput =
    document.getElementById("nickname");

const roomInput =
    document.getElementById("room");

const joinButton =
    document.getElementById("joinButton");

const error =
    document.getElementById("error");


const savedNickname =
    localStorage.getItem("nickname");

if (savedNickname) {
    nicknameInput.value = savedNickname;
}


function joinRoom() {

    const nickname =
        nicknameInput.value.trim();

    const roomText =
        roomInput.value.trim();

    const room =
        Number(roomText);


    if (
        nickname === "" ||
        roomText === "" ||
        !Number.isInteger(room) ||
        room < 0 ||
        room > 1000000
    ) {
        error.style.display = "block";
        return;
    }


    localStorage.setItem(
        "nickname",
        nickname
    );


    window.location.href =
        "room.html?room=" +
        encodeURIComponent(room);
}


joinButton.addEventListener(
    "click",
    joinRoom
);


roomInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinRoom();
        }

    }
);
</script>

</body>
</html>
