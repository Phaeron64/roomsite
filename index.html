<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Rooms</title>

<style>
:root {
    --page: #e7eef8;
    --panel: #ffffff;
    --panel2: #edf4ff;
    --text: #111;
    --muted: #555;

    --blue1: #3d95ff;
    --blue2: #0b54b5;
    --blue3: #003c9d;

    --border: #7f9db9;
    --input: #ffffff;

    --green1: #8ed53f;
    --green2: #4a9d16;

    --link: #0645ad;
}

body.dark {
    --page: #15191f;
    --panel: #242a32;
    --panel2: #1d232b;
    --text: #eeeeee;
    --muted: #aaaaaa;

    --blue1: #315f99;
    --blue2: #193d70;
    --blue3: #102849;

    --border: #566578;
    --input: #171b21;

    --green1: #5a8d34;
    --green2: #315a1b;

    --link: #86b7ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
}

a {
    color: var(--link);
}

.site {
    width: 760px;
    max-width: calc(100% - 20px);
    margin: 25px auto;
}

.header {
    border: 1px solid #164989;
    border-radius: 8px 8px 0 0;
    overflow: hidden;
}

.header-top {
    padding: 12px 16px;

    background:
        linear-gradient(
            to bottom,
            var(--blue1),
            var(--blue2) 55%,
            var(--blue3)
        );

    color: white;
}

.title {
    font-size: 25px;
    font-weight: bold;
    text-shadow: 1px 1px #003377;
}

.subtitle {
    margin-top: 3px;
    font-size: 11px;
}

.nav {
    display: flex;
    align-items: center;
    gap: 3px;

    padding: 4px 6px;

    background:
        linear-gradient(
            to bottom,
            #f8fbff,
            #d9e7f7
        );

    border-top: 1px solid white;
}

body.dark .nav {
    background: #252d37;
}

.nav a {
    padding: 4px 10px;
    color: var(--text);
    text-decoration: none;
}

.nav a:hover {
    background: #d7e8ff;
    color: #003c9d;
}

body.dark .nav a:hover {
    background: #37465b;
    color: white;
}

.spacer {
    flex: 1;
}

button {
    font-family: Tahoma, Arial, sans-serif;
    font-size: 12px;
    cursor: pointer;
}

.theme-button {
    padding: 3px 9px;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #d9e6f4
        );

    color: #111;

    border: 1px solid #7f9db9;
    border-radius: 3px;
}

.main {
    margin-top: 14px;

    background: var(--panel);

    border: 1px solid #9eafd0;
    border-radius: 6px;

    overflow: hidden;
}

.section-title {
    padding: 7px 10px;

    background:
        linear-gradient(
            to bottom,
            #6aa9ff,
            #316ac5
        );

    color: white;

    font-size: 14px;
    font-weight: bold;

    text-shadow: 1px 1px #184b91;
}

.content {
    padding: 18px;
}

.welcome {
    font-size: 18px;
    font-weight: bold;
    color: #245ca5;
}

body.dark .welcome {
    color: #8ebeff;
}

.intro {
    margin: 5px 0 18px;
    color: var(--muted);
}

.join-box {
    background: var(--panel2);

    border: 1px solid #adc3de;
    border-radius: 5px;

    padding: 16px;
}

.row {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
}

.row label {
    width: 125px;
    font-weight: bold;
}

input {
    flex: 1;

    height: 27px;

    background: var(--input);
    color: var(--text);

    border: 1px solid var(--border);

    padding: 4px 6px;

    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
}

input:focus {
    outline: 1px solid #316ac5;
}

.join-button {
    min-width: 100px;

    padding: 5px 16px;

    background:
        linear-gradient(
            to bottom,
            var(--green1),
            var(--green2)
        );

    border: 1px solid #32740e;
    border-radius: 4px;

    color: white;
    font-weight: bold;

    text-shadow: 1px 1px #376d17;
}

.join-button:hover {
    filter: brightness(1.08);
}

#error {
    display: none;

    color: #cc0000;
    font-weight: bold;

    margin-top: 12px;
}

body.dark #error {
    color: #ff7777;
}

.status {
    margin-top: 14px;

    border: 1px solid #b3c6dc;
    border-radius: 3px;

    padding: 5px 7px;

    background: var(--panel2);

    font-size: 11px;
    color: var(--muted);
}

.footer {
    margin-top: 10px;

    text-align: center;
    font-size: 10px;
    color: var(--muted);
}
</style>
</head>

<body>

<div class="site">

    <div class="header">

        <div class="header-top">
            <div class="title">Chat Rooms</div>
            <div class="subtitle">
                Simple temporary chat rooms
            </div>
        </div>

        <div class="nav">
            <a href="./">Home</a>
            <a href="./">Rooms</a>
            <a href="javascript:void(0)">Help</a>

            <div class="spacer"></div>

            <button
                class="theme-button"
                id="themeButton"
            >
                Dark Mode
            </button>
        </div>

    </div>


    <div class="main">

        <div class="section-title">
            Join a Chat Room
        </div>

        <div class="content">

            <div class="welcome">
                Welcome!
            </div>

            <div class="intro">
                Choose a nickname and enter any room number
                from 0 to 1000000.
            </div>


            <div class="join-box">

                <div class="row">
                    <label>Nickname:</label>

                    <input
                        id="nickname"
                        maxlength="24"
                        autocomplete="off"
                    >
                </div>


                <div class="row">
                    <label>Room number:</label>

                    <input
                        id="room"
                        type="number"
                        min="0"
                        max="1000000"
                    >
                </div>


                <button
                    id="joinButton"
                    class="join-button"
                >
                    Join Room
                </button>


                <div id="error">
                    Please enter a nickname and valid room number.
                </div>

            </div>


            <div class="status">
                Status: Ready
            </div>

        </div>

    </div>


    <div class="footer">
        Chat Rooms · Temporary messages
    </div>

</div>


<script>
const nicknameInput =
    document.getElementById("nickname");

const roomInput =
    document.getElementById("room");

const joinButton =
    document.getElementById("joinButton");

const error =
    document.getElementById("error");

const themeButton =
    document.getElementById("themeButton");


if (
    localStorage.getItem("theme") === "dark"
) {
    document.body.classList.add("dark");
}


function updateTheme() {

    themeButton.textContent =
        document.body.classList.contains("dark")
        ? "Light Mode"
        : "Dark Mode";

}


updateTheme();


themeButton.onclick = function() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
            ? "dark"
            : "light"
    );

    updateTheme();

};


const savedNickname =
    localStorage.getItem("nickname");


if (savedNickname) {
    nicknameInput.value = savedNickname;
}


function joinRoom() {

    const nickname =
        nicknameInput.value.trim();

    const roomText =
        roomInput.value.trim();

    const room =
        Number(roomText);


    if (
        nickname === "" ||
        roomText === "" ||
        !Number.isInteger(room) ||
        room < 0 ||
        room > 1000000
    ) {
        error.style.display = "block";
        return;
    }


    error.style.display = "none";

    localStorage.setItem(
        "nickname",
        nickname
    );


    window.location.href =
        "room.html?room=" +
        encodeURIComponent(room);

}


joinButton.onclick =
    joinRoom;


roomInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinRoom();
        }

    }
);
</script>

</body>
</html>
