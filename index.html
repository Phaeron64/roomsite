<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Rooms</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  margin: 0;
  background: #008080;
  font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
  font-size: 13px;
  overflow: hidden;
}

.window {
  width: 390px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  background: #c0c0c0;

  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #000000;
  border-bottom: 2px solid #000000;

  box-shadow:
    1px 1px 0 #808080,
    -1px -1px 0 #dfdfdf;
}

.titlebar {
  height: 26px;
  margin: 2px;
  padding: 4px 6px;

  background: #000080;
  color: white;
  font-weight: bold;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.title-buttons {
  display: flex;
  gap: 2px;
}

.title-button {
  width: 18px;
  height: 18px;
  padding: 0;

  background: #c0c0c0;
  color: black;

  border-top: 2px solid white;
  border-left: 2px solid white;
  border-right: 2px solid #000;
  border-bottom: 2px solid #000;

  font-family: Arial;
  font-size: 11px;
  line-height: 12px;
}

.content {
  padding: 18px;
}

.logo {
  text-align: center;
  font-size: 36px;
  margin-bottom: 8px;
}

h1 {
  font-size: 16px;
  margin: 0 0 8px;
  text-align: center;
}

.description {
  text-align: center;
  margin-bottom: 18px;
}

fieldset {
  border: 2px groove #fff;
  margin: 0 0 14px;
  padding: 12px;
}

legend {
  padding: 0 5px;
}

label {
  display: block;
  margin-bottom: 4px;
}

input {
  width: 100%;
  height: 26px;
  margin-bottom: 12px;
  padding: 3px 5px;

  background: white;
  color: black;

  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid white;
  border-bottom: 2px solid white;

  font-family: Tahoma, sans-serif;
  font-size: 13px;
  outline: none;
}

.button-row {
  display: flex;
  justify-content: center;
}

button {
  min-width: 95px;
  height: 28px;
  padding: 2px 12px;

  background: #c0c0c0;

  border-top: 2px solid white;
  border-left: 2px solid white;
  border-right: 2px solid black;
  border-bottom: 2px solid black;

  font-family: Tahoma, sans-serif;
  font-size: 13px;
  cursor: pointer;
}

button:active {
  border-top: 2px solid black;
  border-left: 2px solid black;
  border-right: 2px solid white;
  border-bottom: 2px solid white;
  padding-top: 4px;
  padding-left: 14px;
}

.error {
  display: none;
  margin-top: 12px;
  color: #800000;
  text-align: center;
}

.statusbar {
  margin: 2px;
  padding: 4px 6px;

  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid white;
  border-bottom: 2px solid white;

  font-size: 11px;
}
</style>
</head>

<body>

<div class="window">

  <div class="titlebar">
    <span>Chat Rooms</span>

    <div class="title-buttons">
      <button class="title-button">_</button>
      <button class="title-button">□</button>
      <button class="title-button">×</button>
    </div>
  </div>

  <div class="content">

    <div class="logo">☏</div>

    <h1>Welcome to Chat Rooms</h1>

    <div class="description">
      Enter a room number to begin chatting.
    </div>

    <fieldset>
      <legend>Join Room</legend>

      <label for="nickname">Nickname:</label>
      <input
        id="nickname"
        type="text"
        maxlength="24"
        autocomplete="off"
      >

      <label for="room">Room number:</label>
      <input
        id="room"
        type="number"
        min="0"
        max="1000000"
        autocomplete="off"
      >
    </fieldset>

    <div class="button-row">
      <button id="joinButton">Join</button>
    </div>

    <div id="error" class="error">
      Please enter a nickname and a room from 0 to 1000000.
    </div>

  </div>

  <div class="statusbar">
    Ready
  </div>

</div>

<script>
const nicknameInput = document.getElementById("nickname");
const roomInput = document.getElementById("room");
const joinButton = document.getElementById("joinButton");
const error = document.getElementById("error");

const oldNickname = localStorage.getItem("nickname");

if (oldNickname) {
  nicknameInput.value = oldNickname;
}

function joinRoom() {

  const nickname = nicknameInput.value.trim();
  const roomText = roomInput.value.trim();
  const room = Number(roomText);

  if (
    !nickname ||
    roomText === "" ||
    !Number.isInteger(room) ||
    room < 0 ||
    room > 1000000
  ) {
    error.style.display = "block";
    return;
  }

  error.style.display = "none";

  localStorage.setItem("nickname", nickname);

  window.location.href =
    "room.html?room=" + encodeURIComponent(room);
}

joinButton.addEventListener("click", joinRoom);

roomInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    joinRoom();
  }
});

nicknameInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    roomInput.focus();
  }
});
</script>

</body>
</html>
