<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat Rooms</title>

<style>
:root {
    --page-bg: #d6d6c8;
    --surface: #c0c0c0;
    --surface-light: #ffffff;
    --surface-dark: #808080;

    --text: #000000;
    --muted: #444444;

    --input-bg: #ffffff;
    --input-text: #000000;

    --chat-bg: #ffffff;

    --blue: #000080;
    --blue-text: #ffffff;

    --link: #0000ee;
}

body.dark {
    --page-bg: #161616;
    --surface: #303030;
    --surface-light: #555555;
    --surface-dark: #080808;

    --text: #eeeeee;
    --muted: #bbbbbb;

    --input-bg: #181818;
    --input-text: #eeeeee;

    --chat-bg: #181818;

    --blue: #202070;
    --blue-text: #ffffff;

    --link: #7f9fff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}

a {
    color: var(--link);
}

.site {
    width: 760px;
    max-width: calc(100% - 20px);
    margin: 20px auto;
}

.top {
    background: var(--surface);

    border-top: 2px solid var(--surface-light);
    border-left: 2px solid var(--surface-light);
    border-right: 2px solid var(--surface-dark);
    border-bottom: 2px solid var(--surface-dark);
}

.logo {
    padding: 12px;

    font-size: 25px;
    font-weight: bold;

    color: #000080;

    text-shadow: 1px 1px #ffffff;
}

body.dark .logo {
    color: #9da8ff;
    text-shadow: 1px 1px #000000;
}

.tagline {
    font-size: 11px;
    font-weight: normal;
    color: var(--muted);
    margin-top: 3px;
}

.menu {
    min-height: 28px;

    display: flex;
    align-items: center;

    background: var(--surface);

    border-top: 1px solid var(--surface-light);

    padding: 3px 5px;
}

.menu a {
    color: var(--text);
    text-decoration: none;

    padding: 4px 10px;
}

.menu a:hover {
    background: var(--blue);
    color: white;
}

.spacer {
    flex: 1;
}

button {
    background: var(--surface);
    color: var(--text);

    border-top: 2px solid var(--surface-light);
    border-left: 2px solid var(--surface-light);
    border-right: 2px solid var(--surface-dark);
    border-bottom: 2px solid var(--surface-dark);

    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;

    padding: 4px 12px;

    cursor: pointer;
}

button:active {
    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);
}

.main {
    margin-top: 12px;

    background: var(--surface);

    border-top: 2px solid var(--surface-light);
    border-left: 2px solid var(--surface-light);
    border-right: 2px solid var(--surface-dark);
    border-bottom: 2px solid var(--surface-dark);
}

.section-title {
    background: var(--blue);
    color: var(--blue-text);

    font-weight: bold;

    padding: 5px 8px;
}

.content {
    padding: 15px;
}

.welcome {
    font-size: 16px;
    font-weight: bold;

    margin-bottom: 8px;
}

.notice {
    margin-bottom: 16px;
}

.panel {
    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);

    padding: 12px;

    background: var(--surface);
}

.form-row {
    display: flex;
    align-items: center;

    margin-bottom: 10px;
}

.form-row label {
    width: 120px;
}

input {
    flex: 1;

    height: 25px;

    background: var(--input-bg);
    color: var(--input-text);

    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);

    padding: 3px 5px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}

.actions {
    margin-top: 12px;
}

#error {
    display: none;

    color: #cc0000;
    font-weight: bold;

    margin-top: 10px;
}

body.dark #error {
    color: #ff7777;
}

.status {
    margin-top: 12px;

    padding: 4px 6px;

    background: var(--surface);

    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);

    font-size: 11px;
}

.footer {
    margin-top: 12px;

    text-align: center;

    font-size: 10px;
    color: var(--muted);
}
</style>
</head>

<body>

<div class="site">

    <div class="top">

        <div class="logo">
            Chat Rooms

            <div class="tagline">
                Temporary chat rooms on the World Wide Web
            </div>
        </div>

        <div class="menu">

            <a href="./">Home</a>
            <a href="./">Rooms</a>
            <a href="javascript:void(0)">Help</a>

            <div class="spacer"></div>

            <button id="themeButton">
                Dark Mode
            </button>

        </div>

    </div>


    <div class="main">

        <div class="section-title">
            Join a Chat Room
        </div>

        <div class="content">

            <div class="welcome">
                Welcome!
            </div>

            <div class="notice">
                Pick a nickname and enter any room number from
                <b>0</b> to <b>1000000</b>.
            </div>


            <div class="panel">

                <div class="form-row">

                    <label for="nickname">
                        Nickname:
                    </label>

                    <input
                        id="nickname"
                        maxlength="24"
                        autocomplete="off"
                    >

                </div>


                <div class="form-row">

                    <label for="room">
                        Room number:
                    </label>

                    <input
                        id="room"
                        type="number"
                        min="0"
                        max="1000000"
                        autocomplete="off"
                    >

                </div>


                <div class="actions">

                    <button id="joinButton">
                        Join Room
                    </button>

                </div>


                <div id="error">
                    Please enter a nickname and valid room number.
                </div>

            </div>


            <div class="status">
                Status: Ready
            </div>

        </div>

    </div>


    <div class="footer">
        Chat Rooms · Messages are temporary
    </div>

</div>


<script>

const nicknameInput =
    document.getElementById("nickname");

const roomInput =
    document.getElementById("room");

const joinButton =
    document.getElementById("joinButton");

const error =
    document.getElementById("error");

const themeButton =
    document.getElementById("themeButton");


function updateThemeButton() {

    if (
        document.body.classList.contains("dark")
    ) {
        themeButton.textContent =
            "Light Mode";
    } else {
        themeButton.textContent =
            "Dark Mode";
    }

}


const savedTheme =
    localStorage.getItem("theme");


if (savedTheme === "dark") {

    document.body.classList.add(
        "dark"
    );

}


updateThemeButton();


themeButton.addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "dark"
        );


        const theme =
            document.body.classList.contains("dark")
            ? "dark"
            : "light";


        localStorage.setItem(
            "theme",
            theme
        );


        updateThemeButton();

    }
);


const savedNickname =
    localStorage.getItem("nickname");


if (savedNickname) {

    nicknameInput.value =
        savedNickname;

}


function joinRoom() {

    const nickname =
        nicknameInput.value.trim();

    const roomText =
        roomInput.value.trim();

    const room =
        Number(roomText);


    if (
        nickname === "" ||
        roomText === "" ||
        !Number.isInteger(room) ||
        room < 0 ||
        room > 1000000
    ) {

        error.style.display =
            "block";

        return;

    }


    error.style.display =
        "none";


    localStorage.setItem(
        "nickname",
        nickname
    );


    window.location.href =
        "room.html?room=" +
        encodeURIComponent(room);

}


joinButton.addEventListener(
    "click",
    joinRoom
);


roomInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            joinRoom();

        }

    }
);

</script>

</body>
</html>
