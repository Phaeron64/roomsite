<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat Room</title>

<style>
:root {
    --desktop: #008080;
    --face: #c0c0c0;
    --light: #ffffff;
    --dark: #808080;
    --black: #000000;

    --content: #ffffff;
    --text: #000000;
    --input: #ffffff;

    --title: #000080;
    --link: #0000ff;
}

body.dark {
    --desktop: #1b1b1b;
    --face: #303030;
    --light: #5a5a5a;
    --dark: #111111;
    --black: #000000;

    --content: #1c1c1c;
    --text: #eeeeee;
    --input: #151515;

    --title: #000060;
    --link: #8ea7ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 8px;

    background: var(--desktop);
    color: var(--text);

    font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
    font-size: 12px;
}

.window {
    width: 820px;
    max-width: 100%;

    margin: auto;

    background: var(--face);

    border-top: 2px solid var(--light);
    border-left: 2px solid var(--light);
    border-right: 2px solid var(--black);
    border-bottom: 2px solid var(--black);

    padding: 2px;
}

.titlebar {
    height: 24px;

    display: flex;
    align-items: center;

    padding: 3px 5px;

    background: var(--title);
    color: white;

    font-weight: bold;
}

.titlebar-text {
    flex: 1;
}

.title-buttons {
    display: flex;
    gap: 2px;
}

button {
    min-width: 80px;
    height: 25px;

    background: var(--face);
    color: var(--text);

    border-top: 2px solid var(--light);
    border-left: 2px solid var(--light);
    border-right: 2px solid var(--black);
    border-bottom: 2px solid var(--black);

    font-family: inherit;
    font-size: 12px;

    cursor: pointer;
}

button:active {
    border-top: 2px solid var(--black);
    border-left: 2px solid var(--black);
    border-right: 2px solid var(--light);
    border-bottom: 2px solid var(--light);
}

.title-button {
    width: 18px;
    min-width: 18px;
    height: 18px;

    padding: 0;

    font-size: 10px;
}

.menubar {
    height: 25px;

    display: flex;
    align-items: center;

    padding: 2px 5px;

    border-bottom: 1px solid var(--dark);
}

.menubar a {
    color: var(--text);
    text-decoration: none;

    padding: 4px 8px;
}

.menubar a:hover {
    background: var(--title);
    color: white;
}

.toolbar {
    display: flex;
    align-items: center;

    min-height: 38px;

    padding: 5px;

    border-top: 1px solid var(--light);
    border-bottom: 1px solid var(--dark);
}

.toolbar a {
    color: var(--text);
    text-decoration: none;

    margin-right: 15px;
}

.spacer {
    flex: 1;
}

.addressbar {
    display: flex;
    align-items: center;

    gap: 5px;

    padding: 4px;

    border-bottom: 1px solid var(--dark);
}

.address {
    flex: 1;

    height: 23px;

    padding: 3px 5px;

    background: var(--input);

    border-top: 2px solid var(--dark);
    border-left: 2px solid var(--dark);
    border-right: 2px solid var(--light);
    border-bottom: 2px solid var(--light);
}

.content {
    margin: 6px;

    background: var(--content);

    border-top: 2px solid var(--dark);
    border-left: 2px solid var(--dark);
    border-right: 2px solid var(--light);
    border-bottom: 2px solid var(--light);

    padding: 12px;
}

.room-header {
    display: flex;
    align-items: baseline;

    border-bottom: 1px solid var(--dark);

    padding-bottom: 7px;
    margin-bottom: 9px;
}

.room-header h1 {
    margin: 0;

    font-size: 17px;
}

.room-user {
    margin-left: auto;
}

#messages {
    height: 380px;

    overflow-y: auto;

    background: var(--input);

    border-top: 2px solid var(--dark);
    border-left: 2px solid var(--dark);
    border-right: 2px solid var(--light);
    border-bottom: 2px solid var(--light);

    padding: 7px;
}

.message {
    margin-bottom: 11px;
}

.name {
    color: var(--title);
    font-weight: bold;
}

body.dark .name {
    color: #8fa5ff;
}

.time {
    margin-left: 6px;

    color: #777;
    font-size: 10px;
}

.text {
    margin-top: 2px;
    margin-left: 10px;

    white-space: pre-wrap;
    word-break: break-word;
}

.composer {
    margin-top: 8px;

    background: var(--face);

    border-top: 2px solid var(--light);
    border-left: 2px solid var(--light);
    border-right: 2px solid var(--dark);
    border-bottom: 2px solid var(--dark);

    padding: 7px;
}

.composer label {
    display: block;

    margin-bottom: 4px;
}

.send-row {
    display: flex;

    gap: 5px;
}

#messageInput {
    flex: 1;

    height: 26px;

    background: var(--input);
    color: var(--text);

    border-top: 2px solid var(--dark);
    border-left: 2px solid var(--dark);
    border-right: 2px solid var(--light);
    border-bottom: 2px solid var(--light);

    padding: 3px 5px;

    font-family: inherit;
}

.statusbar {
    display: flex;

    gap: 3px;

    padding: 3px;
}

.status {
    padding: 3px 5px;

    border-top: 2px solid var(--dark);
    border-left: 2px solid var(--dark);
    border-right: 2px solid var(--light);
    border-bottom: 2px solid var(--light);
}

#status {
    flex: 1;
}
</style>
</head>

<body>

<div class="window">

    <div class="titlebar">

        <div
            class="titlebar-text"
            id="titleText"
        >
            Chat Rooms
        </div>

        <div class="title-buttons">
            <button class="title-button">_</button>
            <button class="title-button">□</button>
            <button
                class="title-button"
                onclick="window.location.href='./'"
            >×</button>
        </div>

    </div>


    <div class="menubar">
        <a href="./">File</a>
        <a href="./">Edit</a>
        <a href="./">View</a>
        <a href="javascript:void(0)">Help</a>
    </div>


    <div class="toolbar">

        <a href="./">
            ← Back
        </a>

        <a href="./">
            Home
        </a>

        <div class="spacer"></div>

        <button id="themeButton">
            Dark Mode
        </button>

    </div>


    <div class="addressbar">

        <span>
            Address:
        </span>

        <div
            class="address"
            id="address"
        >
            Chat Rooms
        </div>

    </div>


    <div class="content">

        <div class="room-header">

            <h1 id="roomName">
                Room
            </h1>

            <div
                class="room-user"
                id="username"
            >
            </div>

        </div>


        <div id="messages"></div>


        <div class="composer">

            <label for="messageInput">
                Message:
            </label>

            <div class="send-row">

                <input
                    id="messageInput"
                    maxlength="2000"
                    autocomplete="off"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>

    </div>


    <div class="statusbar">

        <div
            class="status"
            id="status"
        >
            Connecting...
        </div>

        <div class="status">
            Internet
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jorkumfnpkjkkjvlwfmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_90otUNYd51yG0oH20wdwxA_-9FeVxsi";


const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const themeButton =
    document.getElementById("themeButton");


if (
    localStorage.getItem("theme") === "dark"
) {
    document.body.classList.add("dark");
}


function updateThemeButton() {

    themeButton.textContent =
        document.body.classList.contains("dark")
            ? "Light Mode"
            : "Dark Mode";

}


updateThemeButton();


themeButton.onclick = function() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
            ? "dark"
            : "light"
    );

    updateThemeButton();

};


const params =
    new URLSearchParams(
        window.location.search
    );

const rawRoom =
    params.get("room");

const room =
    Number(rawRoom);


if (
    rawRoom === null ||
    rawRoom === "" ||
    !Number.isInteger(room) ||
    room < 0 ||
    room > 1000000
) {
    window.location.href = "./";
}


const nickname =
    localStorage.getItem("nickname")
    || "Guest";


const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const statusText =
    document.getElementById("status");


document.getElementById(
    "roomName"
).textContent =
    "Room " + room;


document.getElementById(
    "titleText"
).textContent =
    "Chat Rooms - Room " + room;


document.getElementById(
    "address"
).textContent =
    "Chat Rooms\\Room " + room;


document.getElementById(
    "username"
).textContent =
    "User: " + nickname;


const seen =
    new Set();


function formatTime(value) {

    return new Date(
        value
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function displayMessage(data) {

    if (seen.has(data.id)) {
        return;
    }

    seen.add(data.id);


    const message =
        document.createElement("div");

    message.className =
        "message";


    const name =
        document.createElement("span");

    name.className =
        "name";

    name.textContent =
        data.nickname || "Guest";


    message.appendChild(name);


    if (data.created_at) {

        const time =
            document.createElement("span");

        time.className =
            "time";

        time.textContent =
            "[" +
            formatTime(data.created_at) +
            "]";

        message.appendChild(time);

    }


    const text =
        document.createElement("div");

    text.className =
        "text";

    text.textContent =
        data.message || "";


    message.appendChild(text);

    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;

}


async function loadMessages() {

    statusText.textContent =
        "Loading messages...";


    const {
        data,
        error
    } = await client

        .from("messages")

        .select("*")

        .eq("room", room)

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        statusText.textContent =
            "Error loading messages";

        return;

    }


    for (const message of data) {
        displayMessage(message);
    }


    statusText.textContent =
        "Ready";

}


async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    sendButton.disabled =
        true;


    const {
        data,
        error
    } = await client

        .from("messages")

        .insert({
            room: room,
            nickname: nickname,
            message: text
        })

        .select()

        .single();


    sendButton.disabled =
        false;


    if (error) {

        console.error(error);

        statusText.textContent =
            "Message failed";

        return;

    }


    messageInput.value =
        "";


    displayMessage(data);


    statusText.textContent =
        "Ready";


    messageInput.focus();

}


sendButton.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


client

    .channel(
        "room-" + room
    )

    .on(

        "postgres_changes",

        {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
                "room=eq." + room
        },

        function(payload) {

            displayMessage(
                payload.new
            );

        }

    )

    .subscribe(
        function(state) {

            if (state === "SUBSCRIBED") {
                statusText.textContent =
                    "Ready";
            }

        }
    );


loadMessages();

</script>

</body>
</html>
