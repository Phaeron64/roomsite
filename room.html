<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat Room</title>

<style>
:root {
    --page-bg: #d6d6c8;
    --surface: #c0c0c0;
    --surface-light: #ffffff;
    --surface-dark: #808080;

    --text: #000000;
    --muted: #444444;

    --input-bg: #ffffff;
    --input-text: #000000;

    --chat-bg: #ffffff;

    --blue: #000080;
    --link: #0000ee;
}

body.dark {
    --page-bg: #161616;
    --surface: #303030;
    --surface-light: #555555;
    --surface-dark: #080808;

    --text: #eeeeee;
    --muted: #bbbbbb;

    --input-bg: #181818;
    --input-text: #eeeeee;

    --chat-bg: #181818;

    --blue: #202070;
    --link: #7f9fff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: var(--page-bg);
    color: var(--text);

    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}

.site {
    width: 820px;
    max-width: calc(100% - 20px);

    margin: 18px auto;
}

.top {
    background: var(--surface);

    border-top: 2px solid var(--surface-light);
    border-left: 2px solid var(--surface-light);
    border-right: 2px solid var(--surface-dark);
    border-bottom: 2px solid var(--surface-dark);
}

.logo {
    padding: 10px;

    font-size: 21px;
    font-weight: bold;

    color: #000080;

    text-shadow: 1px 1px white;
}

body.dark .logo {
    color: #9da8ff;
    text-shadow: 1px 1px black;
}

.menu {
    min-height: 28px;

    display: flex;
    align-items: center;

    padding: 3px 5px;

    border-top: 1px solid var(--surface-light);
}

.menu a {
    color: var(--text);
    text-decoration: none;

    padding: 4px 9px;
}

.menu a:hover {
    background: var(--blue);
    color: white;
}

.spacer {
    flex: 1;
}

button {
    background: var(--surface);
    color: var(--text);

    border-top: 2px solid var(--surface-light);
    border-left: 2px solid var(--surface-light);
    border-right: 2px solid var(--surface-dark);
    border-bottom: 2px solid var(--surface-dark);

    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;

    padding: 4px 12px;

    cursor: pointer;
}

button:active {
    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);
}

.main {
    margin-top: 10px;

    background: var(--surface);

    border-top: 2px solid var(--surface-light);
    border-left: 2px solid var(--surface-light);
    border-right: 2px solid var(--surface-dark);
    border-bottom: 2px solid var(--surface-dark);
}

.room-title {
    background: var(--blue);
    color: white;

    font-weight: bold;

    padding: 5px 8px;
}

.room-info {
    padding: 7px 9px;

    border-bottom: 1px solid var(--surface-dark);

    font-size: 11px;
}

#messages {
    height: 430px;

    margin: 8px;

    overflow-y: auto;

    background: var(--chat-bg);
    color: var(--text);

    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);

    padding: 8px;

    font-family: "Courier New", monospace;
    font-size: 13px;
}

.message {
    margin-bottom: 12px;
}

.name {
    color: #000080;
    font-weight: bold;
}

body.dark .name {
    color: #9aa7ff;
}

.time {
    color: var(--muted);
    font-size: 10px;

    margin-left: 5px;
}

.text {
    margin-left: 12px;
    margin-top: 2px;

    white-space: pre-wrap;
    word-break: break-word;
}

.send-panel {
    margin: 8px;

    padding: 7px;

    border-top: 2px solid var(--surface-light);
    border-left: 2px solid var(--surface-light);
    border-right: 2px solid var(--surface-dark);
    border-bottom: 2px solid var(--surface-dark);
}

.send-row {
    display: flex;

    gap: 6px;
}

#messageInput {
    flex: 1;

    height: 27px;

    background: var(--input-bg);
    color: var(--input-text);

    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);

    padding: 3px 5px;

    font-family: "Courier New", monospace;
    font-size: 13px;
}

#sendButton {
    width: 85px;
}

.statusbar {
    display: flex;

    gap: 3px;

    padding: 3px;
}

.status-section {
    padding: 4px 6px;

    border-top: 2px solid var(--surface-dark);
    border-left: 2px solid var(--surface-dark);
    border-right: 2px solid var(--surface-light);
    border-bottom: 2px solid var(--surface-light);

    font-size: 10px;
}

#status {
    flex: 1;
}

#username {
    min-width: 170px;
}

.footer {
    margin-top: 8px;

    text-align: center;

    font-size: 10px;
    color: var(--muted);
}
</style>
</head>

<body>

<div class="site">

    <div class="top">

        <div class="logo">
            Chat Rooms
        </div>

        <div class="menu">

            <a href="./">Home</a>
            <a href="./">Leave Room</a>

            <div class="spacer"></div>

            <button id="themeButton">
                Dark Mode
            </button>

        </div>

    </div>


    <div class="main">

        <div
            class="room-title"
            id="roomName"
        >
            Chat Room
        </div>


        <div class="room-info">
            Messages in this room are temporary.
        </div>


        <div id="messages"></div>


        <div class="send-panel">

            <div class="send-row">

                <input
                    id="messageInput"
                    maxlength="2000"
                    autocomplete="off"
                    placeholder="Type a message..."
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>


        <div class="statusbar">

            <div
                class="status-section"
                id="status"
            >
                Connecting...
            </div>

            <div
                class="status-section"
                id="username"
            >
                User
            </div>

        </div>

    </div>


    <div class="footer">
        Chat Rooms
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jorkumfnpkjkkjvlwfmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_90otUNYd51yG0oH20wdwxA_-9FeVxsi";


const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const themeButton =
    document.getElementById("themeButton");


const savedTheme =
    localStorage.getItem("theme");


if (savedTheme === "dark") {

    document.body.classList.add(
        "dark"
    );

}


function updateThemeButton() {

    themeButton.textContent =
        document.body.classList.contains("dark")
        ? "Light Mode"
        : "Dark Mode";

}


updateThemeButton();


themeButton.addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "dark"
        );


        localStorage.setItem(
            "theme",
            document.body.classList.contains("dark")
            ? "dark"
            : "light"
        );


        updateThemeButton();

    }
);


const params =
    new URLSearchParams(
        window.location.search
    );


const rawRoom =
    params.get("room");

const room =
    Number(rawRoom);


if (
    rawRoom === null ||
    rawRoom === "" ||
    !Number.isInteger(room) ||
    room < 0 ||
    room > 1000000
) {

    window.location.href =
        "./";

}


const nickname =
    localStorage.getItem("nickname")
    || "Guest";


const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const statusText =
    document.getElementById("status");


document.getElementById(
    "roomName"
).textContent =
    "Chat Room #" + room;


document.getElementById(
    "username"
).textContent =
    "User: " + nickname;


const seen =
    new Set();


function formatTime(value) {

    const date =
        new Date(value);


    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function displayMessage(data) {

    if (seen.has(data.id)) {
        return;
    }


    seen.add(data.id);


    const message =
        document.createElement("div");

    message.className =
        "message";


    const header =
        document.createElement("div");


    const name =
        document.createElement("span");

    name.className =
        "name";

    name.textContent =
        data.nickname || "Guest";


    header.appendChild(name);


    if (data.created_at) {

        const time =
            document.createElement("span");

        time.className =
            "time";

        time.textContent =
            "[" +
            formatTime(data.created_at) +
            "]";


        header.appendChild(time);

    }


    const text =
        document.createElement("div");

    text.className =
        "text";

    text.textContent =
        data.message || "";


    message.appendChild(header);
    message.appendChild(text);

    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;

}


async function loadMessages() {

    statusText.textContent =
        "Loading messages...";


    const {
        data,
        error
    } = await client

        .from("messages")

        .select("*")

        .eq(
            "room",
            room
        )

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        statusText.textContent =
            "Error loading messages";

        return;

    }


    for (const message of data) {

        displayMessage(message);

    }


    statusText.textContent =
        "Connected";

}


async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    sendButton.disabled =
        true;


    const {
        data,
        error
    } = await client

        .from("messages")

        .insert({
            room: room,
            nickname: nickname,
            message: text
        })

        .select()

        .single();


    sendButton.disabled =
        false;


    if (error) {

        console.error(error);

        statusText.textContent =
            "Message failed";

        return;

    }


    messageInput.value =
        "";


    displayMessage(data);


    statusText.textContent =
        "Connected";


    messageInput.focus();

}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


client

    .channel(
        "room-" + room
    )

    .on(

        "postgres_changes",

        {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
                "room=eq." + room
        },

        function(payload) {

            displayMessage(
                payload.new
            );

        }

    )

    .subscribe(
        function(state) {

            if (
                state === "SUBSCRIBED"
            ) {

                statusText.textContent =
                    "Connected";

            }

        }
    );


loadMessages();

</script>

</body>
</html>
