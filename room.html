<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://jorkumfnpkjkkjvlwfmq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_90otUNYd51yG0oH20wdwxA_-9FeVxsi";

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);
  const room = Number(params.get("room"));
  const nickname = localStorage.getItem("nickname") || "Guest";

  const input = document.getElementById("messageInput");
  const messages = document.getElementById("messages");

  const seenMessages = new Set();

  if (
    !Number.isInteger(room) ||
    room < 0 ||
    room > 1000000
  ) {
    window.location.href = "./";
  }

  document.getElementById("roomName").textContent = "Room " + room;

  function showMessage(data) {
    if (seenMessages.has(data.id)) return;
    seenMessages.add(data.id);

    const message = document.createElement("div");
    message.className = "message";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = data.nickname;

    const content = document.createElement("div");
    content.className = "text";
    content.textContent = data.message || "";

    message.appendChild(name);
    message.appendChild(content);
    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
  }

  async function loadMessages() {
    const { data, error } = await supabase
      .from("messages")
      .select("*")
      .eq("room", room)
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);
      return;
    }

    data.forEach(showMessage);
  }

  window.sendMessage = async function () {
    const text = input.value.trim();

    if (!text) return;

    input.value = "";

    const { data, error } = await supabase
      .from("messages")
      .insert({
        room: room,
        nickname: nickname,
        message: text
      })
      .select()
      .single();

    if (error) {
      console.error(error);
      alert("Could not send message.");
      return;
    }

    showMessage(data);
  };

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      window.sendMessage();
    }
  });

  supabase
    .channel("room-" + room)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter: "room=eq." + room
      },
      payload => {
        showMessage(payload.new);
      }
    )
    .subscribe();

  loadMessages();
</script>
