<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat Room</title>

<style>
body {
    margin: 0;
    background: #ffffff;
    color: #000000;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}

a {
    color: #0000cc;
}

.page {
    width: 750px;
    max-width: calc(100% - 20px);
    margin: 20px auto;
}

.header {
    background: #000080;
    color: white;
    padding: 6px 8px;
    font-weight: bold;
    font-size: 18px;
}

.navigation {
    background: #c0c0c0;
    border: 1px solid #808080;
    padding: 4px 8px;
    font-size: 11px;
}

.navigation a {
    margin-right: 15px;
}

.info {
    padding: 8px 0;
}

#messages {
    height: 430px;
    overflow-y: scroll;

    border: 2px inset #dddddd;

    padding: 8px;

    background: #ffffff;

    font-family:
        "Courier New",
        monospace;

    font-size: 13px;
}

.message {
    margin-bottom: 11px;
}

.name {
    color: #000080;
    font-weight: bold;
}

.time {
    color: #777777;
    font-size: 10px;
    margin-left: 5px;
}

.text {
    margin-left: 12px;
    white-space: pre-wrap;
    word-break: break-word;
}

.send-area {
    margin-top: 8px;
}

#messageInput {
    width: calc(100% - 90px);

    padding: 4px;

    border: 2px inset #dddddd;

    font-family:
        "Courier New",
        monospace;

    font-size: 13px;
}

button {
    width: 80px;
    padding: 4px;
}

#status {
    margin-top: 5px;
    font-size: 10px;
    color: #666666;
}

.footer {
    margin-top: 18px;
    border-top: 1px solid #aaaaaa;
    padding-top: 5px;

    font-size: 10px;
    color: #777777;
}
</style>
</head>

<body>

<div class="page">

    <div
        class="header"
        id="roomName"
    >
        Chat Room
    </div>

    <div class="navigation">
        <a href="./">Home</a>
        <a href="./">Leave Room</a>
        <span id="username"></span>
    </div>

    <div class="info">
        Messages in this room are temporary.
    </div>

    <div id="messages">
    </div>

    <div class="send-area">

        <input
            id="messageInput"
            maxlength="2000"
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

    </div>

    <div id="status">
        Connecting...
    </div>

    <div class="footer">
        Chat Rooms
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jorkumfnpkjkkjvlwfmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_90otUNYd51yG0oH20wdwxA_-9FeVxsi";


const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(
        window.location.search
    );


const rawRoom =
    params.get("room");

const room =
    Number(rawRoom);


if (
    rawRoom === null ||
    rawRoom === "" ||
    !Number.isInteger(room) ||
    room < 0 ||
    room > 1000000
) {
    window.location.href = "./";
}


const nickname =
    localStorage.getItem("nickname")
    || "Guest";


const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const statusText =
    document.getElementById("status");


document.getElementById(
    "roomName"
).textContent =
    "Chat Room #" + room;


document.getElementById(
    "username"
).textContent =
    "Logged in as: " + nickname;


const seen =
    new Set();


function timeText(value) {

    const date =
        new Date(value);

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function displayMessage(data) {

    if (seen.has(data.id)) {
        return;
    }

    seen.add(data.id);


    const message =
        document.createElement("div");

    message.className =
        "message";


    const header =
        document.createElement("div");


    const name =
        document.createElement("span");

    name.className =
        "name";

    name.textContent =
        data.nickname || "Guest";


    header.appendChild(name);


    if (data.created_at) {

        const time =
            document.createElement("span");

        time.className =
            "time";

        time.textContent =
            "[" +
            timeText(data.created_at) +
            "]";

        header.appendChild(time);
    }


    const text =
        document.createElement("div");

    text.className =
        "text";

    text.textContent =
        data.message || "";


    message.appendChild(header);
    message.appendChild(text);

    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;
}


async function loadMessages() {

    statusText.textContent =
        "Loading messages...";


    const {
        data,
        error
    } = await client

        .from("messages")

        .select("*")

        .eq(
            "room",
            room
        )

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        statusText.textContent =
            "Error loading messages.";

        return;
    }


    for (const message of data) {
        displayMessage(message);
    }


    statusText.textContent =
        "Connected.";
}


async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    sendButton.disabled =
        true;


    const {
        data,
        error
    } = await client

        .from("messages")

        .insert({
            room: room,
            nickname: nickname,
            message: text
        })

        .select()

        .single();


    sendButton.disabled =
        false;


    if (error) {

        console.error(error);

        statusText.textContent =
            "Message could not be sent.";

        return;
    }


    messageInput.value =
        "";


    displayMessage(data);


    statusText.textContent =
        "Connected.";


    messageInput.focus();
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


client
    .channel(
        "room-" + room
    )

    .on(
        "postgres_changes",

        {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
                "room=eq." + room
        },

        function(payload) {
            displayMessage(
                payload.new
            );
        }
    )

    .subscribe(
        function(state) {

            if (
                state ===
                "SUBSCRIBED"
            ) {

                statusText.textContent =
                    "Connected.";

            }

        }
    );


loadMessages();

</script>

</body>
</html>
