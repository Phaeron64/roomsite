<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px 20px;
      background: #181818;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #roomName {
      font-weight: bold;
    }

    header a {
      color: #aaa;
      text-decoration: none;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 3px;
    }

    .text {
      color: #ddd;
      word-break: break-word;
    }

    .bottom {
      padding: 12px;
      background: #181818;
      border-top: 1px solid #333;
    }

    .inputRow {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      background: #111;
      color: white;
      border: 1px solid #444;
      border-radius: 7px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 0 18px;
      cursor: pointer;
      font-size: 15px;
    }

    #sendButton {
      background: white;
      color: black;
    }

    #fileButton {
      background: #333;
      color: white;
    }

    #fileInput {
      display: none;
    }

    .info {
      color: #777;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<header>
  <div id="roomName">Room</div>
  <a href="./">Leave</a>
</header>

<div id="messages"></div>

<div class="bottom">

  <div class="inputRow">

    <button id="fileButton" onclick="document.getElementById('fileInput').click()">
      +
    </button>

    <input id="fileInput" type="file">

    <input
      id="messageInput"
      type="text"
      placeholder="Message"
      maxlength="2000"
    >

    <button id="sendButton" onclick="sendMessage()">
      Send
    </button>

  </div>

  <div class="info">
    Messages will eventually disappear automatically.
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const room = params.get("room");
  const nickname = localStorage.getItem("nickname") || "Guest";

  if (
    room === null ||
    !Number.isInteger(Number(room)) ||
    Number(room) < 0 ||
    Number(room) > 1000000
  ) {
    window.location.href = "./";
  }

  document.getElementById("roomName").textContent =
    "Room " + room;

  const input = document.getElementById("messageInput");

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    const message = document.createElement("div");
    message.className = "message";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = nickname;

    const content = document.createElement("div");
    content.className = "text";
    content.textContent = text;

    message.appendChild(name);
    message.appendChild(content);

    document.getElementById("messages").appendChild(message);

    input.value = "";

    document.getElementById("messages").scrollTop =
      document.getElementById("messages").scrollHeight;
  }
</script>

</body>
</html>
