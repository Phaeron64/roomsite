<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat Room</title>

<style>
:root {
    --page: #e7eef8;
    --panel: #ffffff;
    --panel2: #edf4ff;

    --text: #111;
    --muted: #555;

    --blue1: #3d95ff;
    --blue2: #0b54b5;
    --blue3: #003c9d;

    --border: #7f9db9;

    --chat: #ffffff;
    --input: #ffffff;

    --link: #0645ad;
}

body.dark {
    --page: #15191f;
    --panel: #242a32;
    --panel2: #1d232b;

    --text: #eeeeee;
    --muted: #aaaaaa;

    --blue1: #315f99;
    --blue2: #193d70;
    --blue3: #102849;

    --border: #566578;

    --chat: #171b21;
    --input: #171b21;

    --link: #86b7ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: var(--page);
    color: var(--text);

    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
}

.site {
    width: 850px;
    max-width: calc(100% - 20px);

    margin: 18px auto;
}

.header {
    border: 1px solid #164989;
    border-radius: 8px 8px 0 0;

    overflow: hidden;
}

.header-top {
    padding: 10px 14px;

    background:
        linear-gradient(
            to bottom,
            var(--blue1),
            var(--blue2) 55%,
            var(--blue3)
        );

    color: white;
}

.logo {
    font-size: 21px;
    font-weight: bold;

    text-shadow: 1px 1px #003377;
}

.nav {
    display: flex;
    align-items: center;

    padding: 4px 6px;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #dce9f7
        );
}

body.dark .nav {
    background: #252d37;
}

.nav a {
    padding: 4px 9px;

    color: var(--text);
    text-decoration: none;
}

.nav a:hover {
    background: #d5e7ff;
    color: #003c9d;
}

body.dark .nav a:hover {
    background: #37465b;
    color: white;
}

.spacer {
    flex: 1;
}

button {
    font-family: Tahoma, Arial, sans-serif;
    cursor: pointer;
}

.theme-button {
    padding: 3px 9px;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #d9e6f4
        );

    color: #111;

    border: 1px solid #7f9db9;
    border-radius: 3px;
}

.main {
    margin-top: 12px;

    background: var(--panel);

    border: 1px solid #9eafd0;
    border-radius: 6px;

    overflow: hidden;
}

.room-title {
    padding: 7px 10px;

    background:
        linear-gradient(
            to bottom,
            #6aa9ff,
            #316ac5
        );

    color: white;

    font-size: 14px;
    font-weight: bold;

    text-shadow: 1px 1px #184b91;
}

.room-info {
    background: var(--panel2);

    padding: 7px 10px;

    border-bottom: 1px solid #adc3de;

    color: var(--muted);

    font-size: 11px;
}

#messages {
    height: 430px;

    margin: 10px;

    padding: 9px;

    overflow-y: auto;

    background: var(--chat);
    color: var(--text);

    border: 1px solid var(--border);

    font-family: Tahoma, Arial, sans-serif;
}

.message {
    padding: 6px 7px;
    margin-bottom: 4px;

    border-bottom: 1px solid #d7e0eb;
}

body.dark .message {
    border-bottom-color: #343b44;
}

.name {
    font-weight: bold;
    color: #245ca5;
}

body.dark .name {
    color: #86b7ff;
}

.time {
    margin-left: 6px;

    color: var(--muted);

    font-size: 10px;
    font-weight: normal;
}

.text {
    margin-top: 2px;
    margin-left: 10px;

    white-space: pre-wrap;
    word-break: break-word;
}

.send-panel {
    margin: 10px;

    background: var(--panel2);

    border: 1px solid #adc3de;
    border-radius: 5px;

    padding: 8px;
}

.send-row {
    display: flex;
    gap: 6px;
}

#messageInput {
    flex: 1;

    height: 29px;

    background: var(--input);
    color: var(--text);

    border: 1px solid var(--border);

    padding: 4px 6px;

    font-family: Tahoma, Arial, sans-serif;
}

#sendButton {
    width: 90px;

    background:
        linear-gradient(
            to bottom,
            #8ed53f,
            #4a9d16
        );

    border: 1px solid #32740e;
    border-radius: 4px;

    color: white;
    font-weight: bold;

    text-shadow: 1px 1px #376d17;
}

.statusbar {
    display: flex;

    margin: 0 10px 10px;

    gap: 4px;
}

.status-section {
    background: var(--panel2);

    border: 1px solid #adc3de;

    padding: 4px 7px;

    color: var(--muted);

    font-size: 10px;
}

#status {
    flex: 1;
}

#username {
    min-width: 170px;
}

.footer {
    margin-top: 8px;

    text-align: center;
    color: var(--muted);

    font-size: 10px;
}
</style>
</head>

<body>

<div class="site">

    <div class="header">

        <div class="header-top">
            <div class="logo">
                Chat Rooms
            </div>
        </div>


        <div class="nav">

            <a href="./">Home</a>

            <a href="./">
                Leave Room
            </a>

            <div class="spacer"></div>

            <button
                class="theme-button"
                id="themeButton"
            >
                Dark Mode
            </button>

        </div>

    </div>


    <div class="main">

        <div
            id="roomName"
            class="room-title"
        >
            Chat Room
        </div>


        <div class="room-info">
            Messages in this room are temporary.
        </div>


        <div id="messages"></div>


        <div class="send-panel">

            <div class="send-row">

                <input
                    id="messageInput"
                    maxlength="2000"
                    autocomplete="off"
                    placeholder="Type your message here..."
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>


        <div class="statusbar">

            <div
                class="status-section"
                id="status"
            >
                Connecting...
            </div>

            <div
                class="status-section"
                id="username"
            >
                User
            </div>

        </div>

    </div>


    <div class="footer">
        Chat Rooms
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jorkumfnpkjkkjvlwfmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_90otUNYd51yG0oH20wdwxA_-9FeVxsi";


const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const themeButton =
    document.getElementById("themeButton");


if (
    localStorage.getItem("theme") === "dark"
) {
    document.body.classList.add("dark");
}


function updateTheme() {

    themeButton.textContent =
        document.body.classList.contains("dark")
        ? "Light Mode"
        : "Dark Mode";

}


updateTheme();


themeButton.onclick = function() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
            ? "dark"
            : "light"
    );

    updateTheme();

};


const params =
    new URLSearchParams(
        window.location.search
    );


const rawRoom =
    params.get("room");

const room =
    Number(rawRoom);


if (
    rawRoom === null ||
    rawRoom === "" ||
    !Number.isInteger(room) ||
    room < 0 ||
    room > 1000000
) {
    window.location.href = "./";
}


const nickname =
    localStorage.getItem("nickname")
    || "Guest";


const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const statusText =
    document.getElementById("status");


document.getElementById(
    "roomName"
).textContent =
    "Chat Room #" + room;


document.getElementById(
    "username"
).textContent =
    "User: " + nickname;


const seen =
    new Set();


function formatTime(value) {

    return new Date(
        value
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function displayMessage(data) {

    if (seen.has(data.id)) {
        return;
    }


    seen.add(data.id);


    const message =
        document.createElement("div");

    message.className =
        "message";


    const name =
        document.createElement("span");

    name.className =
        "name";

    name.textContent =
        data.nickname || "Guest";


    message.appendChild(name);


    if (data.created_at) {

        const time =
            document.createElement("span");

        time.className =
            "time";

        time.textContent =
            "[" +
            formatTime(data.created_at) +
            "]";


        message.appendChild(time);

    }


    const text =
        document.createElement("div");

    text.className =
        "text";

    text.textContent =
        data.message || "";


    message.appendChild(text);

    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;

}


async function loadMessages() {

    statusText.textContent =
        "Loading messages...";


    const {
        data,
        error
    } = await client

        .from("messages")

        .select("*")

        .eq("room", room)

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        statusText.textContent =
            "Error loading messages";

        return;

    }


    for (const message of data) {
        displayMessage(message);
    }


    statusText.textContent =
        "Connected";

}


async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    sendButton.disabled =
        true;


    const {
        data,
        error
    } = await client

        .from("messages")

        .insert({
            room: room,
            nickname: nickname,
            message: text
        })

        .select()

        .single();


    sendButton.disabled =
        false;


    if (error) {

        console.error(error);

        statusText.textContent =
            "Message failed";

        return;

    }


    messageInput.value =
        "";


    displayMessage(data);


    statusText.textContent =
        "Connected";


    messageInput.focus();

}


sendButton.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


client

    .channel(
        "room-" + room
    )

    .on(

        "postgres_changes",

        {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
                "room=eq." + room
        },

        function(payload) {

            displayMessage(
                payload.new
            );

        }

    )

    .subscribe(
        function(state) {

            if (
                state === "SUBSCRIBED"
            ) {
                statusText.textContent =
                    "Connected";
            }

        }
    );


loadMessages();

</script>

</body>
</html>
